version: 2.1
orbs:
  docker: circleci/docker@2.1.4
jobs:
  build-and-test:
    docker:
      - image: cimg/openjdk:21.0
    working_directory: ~/project/microcommerce
    steps:
      - checkout:
         path: ~/project
         
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      - run:
          name: Test
          command: mvn test
      - persist_to_workspace:
         root: target
         paths:
            - "*.jar"

  deploy-docker-image:
    docker:
       - image: cimg/base:stable
    resource_class: medium
    working_directory: ~/project/microcommerce
    steps:
      - checkout:
         path: ~/project
      - setup_remote_docker:
          version: default
          docker_layer_caching: false
      - attach_workspace:
          at: target
      - docker/login:
          registry: microcommerce.azurecr.io
          username: DOCKER_USER 
          password: DOCKER_PASS
      - docker/build:
          image: microcommerce
          registry: microcommerce.azurecr.io
          tag: latest
          path: .
      - docker/push:
          image: microcommerce
          registry: microcommerce.azurecr.io
          tag: latest

workflows:
  test-and-deploy:
    jobs:
      - build-and-test
      - deploy-docker-image:
          requires:
            - build-and-test